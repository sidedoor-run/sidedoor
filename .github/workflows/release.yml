name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: build binaries
        run: |
          mkdir -p dist
          cd agent
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/sidedoor_darwin_amd64
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/sidedoor_darwin_arm64
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/sidedoor_linux_amd64
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/sidedoor_linux_arm64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/sidedoor_windows_amd64.exe

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: set npm version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          cd npm && npm version $TAG --no-git-tag-version --allow-same-version

      - name: publish npm
        run: cd npm && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
