name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: build and sign darwin binaries
        run: |
          TAG=${GITHUB_REF_NAME#v}
          mkdir -p dist
          cd agent
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=${TAG}" -o ../dist/sidedoor_darwin_amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${TAG}" -o ../dist/sidedoor_darwin_arm64
          codesign --sign - ../dist/sidedoor_darwin_amd64
          codesign --sign - ../dist/sidedoor_darwin_arm64
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries
          path: dist/

  build-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: build linux and windows binaries
        run: |
          TAG=${GITHUB_REF_NAME#v}
          mkdir -p dist
          cd agent
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w -X main.version=${TAG}" -o ../dist/sidedoor_linux_amd64
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w -X main.version=${TAG}" -o ../dist/sidedoor_linux_arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=${TAG}" -o ../dist/sidedoor_windows_amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows-binaries
          path: dist/

  release:
    needs: [build-darwin, build-linux-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: darwin-binaries
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: linux-windows-binaries
          path: dist/

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: set npm version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          cd npm && npm version $TAG --no-git-tag-version --allow-same-version

      - name: publish npm
        run: cd npm && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
